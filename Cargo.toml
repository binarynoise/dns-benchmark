[package]
name = "dns-benchmark"
version = "0.1.0"
edition = "2024"


[dependencies]
chrono = "0.4.40"
csv = "1.3.0"
derivative = "2.2.0"
futures = "0.3.31"
hickory-resolver = { version = "0.25.1", features = ["tls-aws-lc-rs", "webpki-roots"] }
hocon = "0.9"
indexmap = "2.9.0"
rand = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
sprintf = "0.4.0"
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros"] }

[profile.release]
strip = true
lto = "thin"
opt-level = 3
panic = "abort"
