[package]
name = "dns-benchmark"
version = "0.1.0"
edition = "2024"


[dependencies]
chrono = "0.4.42"
csv = "1.4.0"
derivative = "2.2.0"
futures = "0.3.31"
hickory-resolver = { version = "0.25.1", features = ["tls-aws-lc-rs", "webpki-roots"] }
hocon = "0.9"
indicatif = "0.18.3"
indexmap = "2.12.1"
rand = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
sprintf = "0.4.3"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }

[profile.release]
strip = true
lto = "thin"
opt-level = 3
panic = "abort"
